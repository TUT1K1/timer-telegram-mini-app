<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <title>Таймер | Timer</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    :root {
      --orange: #f97316;
      --orange-dark: #ea580c;
      --bg: #fff7ed;
      --text: #1c1917;
      --muted: #78716c;
      --white: #ffffff;
      --border: #fed7aa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 32px;
      font-weight: 800;
    }

    .description {
      margin: 0 auto 28px;
      max-width: 430px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-button {
      min-height: 64px;
      padding: 12px;
      border-radius: 18px;
      background: var(--orange);
      color: var(--white);
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 5px 14px rgba(249, 115, 22, 0.20);
    }

    .menu-button:active {
      transform: scale(0.98);
      background: var(--orange-dark);
    }

    .menu-button.wide {
      grid-column: 1 / 3;
      width: 50%;
      justify-self: center;
    }

    .back-button {
      margin-bottom: 24px;
      padding: 10px 16px;
      border-radius: 14px;
      background: var(--white);
      color: var(--orange-dark);
      border: 1px solid var(--border);
      font-weight: 700;
    }

    .event-title {
      margin: 10px 0 30px;
      text-align: center;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 900;
      text-transform: uppercase;
    }

    .timer {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      align-items: start;
    }

    .timer-unit.days {
      grid-column: 1 / 4;
      margin-bottom: 8px;
    }

    .circle {
      width: 112px;
      height: 112px;
      margin: 0 auto;
      border-radius: 50%;
      background: var(--orange);
      color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 7px 20px rgba(249, 115, 22, 0.22);
    }

    .days .circle {
      width: 138px;
      height: 138px;
    }

    .value {
      font-size: 38px;
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .days .value {
      font-size: 46px;
    }

    .label {
      margin-top: 7px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .event-date {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
    }

    .empty-message {
      padding: 28px 20px;
      border-radius: 20px;
      background: var(--white);
      border: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
    }

    .empty-message strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 20px;
    }

    @media (max-width: 380px) {
      .circle {
        width: 92px;
        height: 92px;
      }

      .days .circle {
        width: 118px;
        height: 118px;
      }

      .value {
        font-size: 31px;
      }

      .days .value {
        font-size: 39px;
      }

      .event-title {
        font-size: 24px;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --text: #fafaf9;
        --muted: #a8a29e;
        --white: #292524;
        --border: #7c2d12;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <section id="homeScreen" class="screen active">
      <h1>Таймер | Timer</h1>

      <p class="description">
        Узнайте, сколько времени осталось до любимого времени года,
        Нового года или создайте собственное событие.
      </p>

      <div class="menu">
        <button class="menu-button" data-event="winter">ЗИМА</button>
        <button class="menu-button" data-event="spring">ВЕСНА</button>
        <button class="menu-button" data-event="summer">ЛЕТО</button>
        <button class="menu-button" data-event="autumn">ОСЕНЬ</button>
        <button class="menu-button wide" data-event="new-year">НОВЫЙ ГОД</button>
        <button class="menu-button wide" id="customEventsButton">ДОБАВИТЬ СОБЫТИЕ</button>
      </div>
    </section>

    <section id="timerScreen" class="screen">
      <button class="back-button" id="backButton">← НАЗАД</button>

      <h2 class="event-title" id="eventTitle"></h2>

      <div class="timer">
        <div class="timer-unit days">
          <div class="circle">
            <div class="value" id="daysValue">0</div>
            <div class="label">ДНЕЙ</div>
          </div>
        </div>

        <div class="timer-unit">
          <div class="circle">
            <div class="value" id="hoursValue">0</div>
            <div class="label">ЧАСОВ</div>
          </div>
        </div>

        <div class="timer-unit">
          <div class="circle">
            <div class="value" id="minutesValue">0</div>
            <div class="label">МИНУТ</div>
          </div>
        </div>

        <div class="timer-unit">
          <div class="circle">
            <div class="value" id="secondsValue">0</div>
            <div class="label">СЕКУНД</div>
          </div>
        </div>
      </div>

      <div class="event-date" id="eventDate"></div>
    </section>

    <section id="customScreen" class="screen">
      <button class="back-button" id="customBackButton">← НАЗАД</button>

      <div class="empty-message">
        <strong>Пользовательские события</strong>
        Функция создания и сохранения событий будет добавлена следующим этапом.
      </div>
    </section>

  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    /*
      ВАЖНО:
      Date.now() всегда возвращает абсолютное текущее время.
      Мы НЕ прибавляем к нему +3 часа.

      Москва = UTC+3.
      Поэтому +3 часа используется только при построении
      московской полуночи для даты события.
    */

    const MOSCOW_OFFSET_MS = 3 * 60 * 60 * 1000;

    const events = {
      winter: {
        name: "ЗИМЫ",
        month: 12,
        day: 1
      },

      spring: {
        name: "ВЕСНЫ",
        month: 3,
        day: 1
      },

      summer: {
        name: "ЛЕТА",
        month: 6,
        day: 1
      },

      autumn: {
        name: "ОСЕНИ",
        month: 9,
        day: 1
      },

      "new-year": {
        name: "НОВОГО ГОДА",
        month: 1,
        day: 1
      }
    };

    let currentTimer = null;
    let timerInterval = null;

    /*
      Получаем текущую календарную дату именно в Москве.
      Здесь мы не изменяем реальный timestamp.
    */
    function getMoscowDateParts() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Moscow",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const result = {};

      for (const part of parts) {
        if (part.type !== "literal") {
          result[part.type] = part.value;
        }
      }

      return {
        year: Number(result.year),
        month: Number(result.month),
        day: Number(result.day)
      };
    }

    /*
      Возвращает настоящий Unix timestamp московской полуночи.

      Например:
      2026-09-21 00:00 по Москве
      = 2026-09-20 21:00 UTC.
    */
    function getMoscowMidnightTimestamp(year, month, day) {
      return Date.UTC(year, month - 1, day) - MOSCOW_OFFSET_MS;
    }

    /*
      Находит ближайшее наступление события.
    */
    function getNextEventTimestamp(month, day) {
      const moscowDate = getMoscowDateParts();

      let targetTimestamp = getMoscowMidnightTimestamp(
        moscowDate.year,
        month,
        day
      );

      /*
        Если событие уже наступило в этом году,
        берём его дату в следующем году.
      */
      if (targetTimestamp <= Date.now()) {
        targetTimestamp = getMoscowMidnightTimestamp(
          moscowDate.year + 1,
          month,
          day
        );
      }

      return targetTimestamp;
    }

    function formatEventDate(timestamp) {
      return new Intl.DateTimeFormat("ru-RU", {
        timeZone: "Europe/Moscow",
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(new Date(timestamp));
    }

    /*
      Считаем оставшееся время напрямую от настоящего момента
      до московской полуночи.
    */
    function updateTimer(timestamp) {
      const difference = Math.max(0, timestamp - Date.now());

      const totalSeconds = Math.floor(difference / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById("daysValue").textContent = days;
      document.getElementById("hoursValue").textContent = hours;
      document.getElementById("minutesValue").textContent = minutes;
      document.getElementById("secondsValue").textContent = seconds;
    }

    function openBuiltInEvent(eventKey) {
      const event = events[eventKey];

      if (!event) {
        return;
      }

      const timestamp = getNextEventTimestamp(
        event.month,
        event.day
      );

      currentTimer = timestamp;

      document.getElementById("eventTitle").textContent =
        `ДО ${event.name} ОСТАЛОСЬ`;

      document.getElementById("eventDate").textContent =
        formatEventDate(timestamp);

      document.getElementById("homeScreen").classList.remove("active");
      document.getElementById("customScreen").classList.remove("active");
      document.getElementById("timerScreen").classList.add("active");

      if (timerInterval) {
        clearInterval(timerInterval);
      }

      updateTimer(currentTimer);

      timerInterval = setInterval(() => {
        updateTimer(currentTimer);
      }, 250);
    }

    function showHomeScreen() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      document.getElementById("timerScreen").classList.remove("active");
      document.getElementById("customScreen").classList.remove("active");
      document.getElementById("homeScreen").classList.add("active");
    }

    function showCustomScreen() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      document.getElementById("homeScreen").classList.remove("active");
      document.getElementById("timerScreen").classList.remove("active");
      document.getElementById("customScreen").classList.add("active");
    }

    document.querySelectorAll("[data-event]").forEach(button => {
      button.addEventListener("click", () => {
        openBuiltInEvent(button.dataset.event);
      });
    });

    document.getElementById("backButton").addEventListener("click", () => {
      showHomeScreen();
    });

    document.getElementById("customBackButton").addEventListener("click", () => {
      showHomeScreen();
    });

    document.getElementById("customEventsButton").addEventListener("click", () => {
      showCustomScreen();
    });
  </script>
</body>
</html>
